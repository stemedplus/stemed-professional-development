name: Research Experiences for Teachers in Engineering and Computer Science
short: NSF RET
providers: [National Science Foundation]
sponsor_type: Federally funded program
funding_note: NSF's Engineering and Computer and Information Science and Engineering directorates fund RET Sites at universities across the US.
type: research
audiences: [K-12 teachers]
grades: [Middle school, High school]
disciplines: [Computing, Engineering]
format: in person
cost: stipend
cost_note: Sites pay teachers a stipend; many also cover housing or travel.
credit: Some sites offer graduate credit or continuing education units.
url: https://www.nsf.gov/funding/opportunities/research-experiences-teachers-engineering-computer-science/nsf24-503/solicitation
frequency: annual
schedule: Six or more weeks each summer at university sites; each site sets its own deadline, most between January and April.
summary: Teachers join a university research team for the summer, then turn what they learned into classroom lessons. To find a site, search NSF awards for "RET Site" or search the web for "RET site" and your state.
checked: 2026-11-12
notes: The program page is the NSF solicitation; there is no central application. Consider linking to an NSF award search once a stable URL is available.
